# Sitio NGINX endurecido de CHINOS CAFE en la maquina virtual (sucursal Veraguas).
# Copiar a /etc/nginx/sites-available/chinos_cafe y recargar nginx.
#   sudo cp deploy/nginx_chinos_cafe.conf /etc/nginx/sites-available/chinos_cafe
#   sudo nginx -t && sudo systemctl reload nginx
#
# Defensas aplicadas (equivalentes a un servidor bien endurecido):
#   - Redireccion de HTTP (80) a HTTPS (443) con 301.
#   - HTTP/2 + TLS.
#   - Cabeceras de seguridad: HSTS, CSP estricta, Permissions-Policy,
#     X-Frame-Options DENY, X-Content-Type-Options, Referrer-Policy, COOP/CORP/COEP.
#   - server_tokens off (oculta la version de NGINX).
#   - limit_req (rate-limiting) contra fuerza bruta / DoS por HTTP.

# Zona de rate-limiting (contexto http). 30 req/s por IP con rafagas de 60.
limit_req_zone $binary_remote_addr zone=chinos_limite:10m rate=30r/s;

# --- HTTP: solo redirige a HTTPS -------------------------------------------
server {
    listen 80;
    server_name 192.168.56.50;
    server_tokens off;
    return 301 https://$host$request_uri;
}

# --- HTTPS: sitio real ------------------------------------------------------
server {
    listen 443 ssl http2;
    server_name 192.168.56.50;

    ssl_certificate     /etc/nginx/ssl/chinos.crt;
    ssl_certificate_key /etc/nginx/ssl/chinos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    # Cabeceras de seguridad (always = tambien en respuestas de error).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / {
        limit_req zone=chinos_limite burst=60 nodelay;   # frena rafagas de peticiones
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
