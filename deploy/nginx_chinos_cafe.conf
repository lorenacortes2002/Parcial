# Sitio NGINX endurecido de CHINOS CAFE en la maquina virtual (sucursal Veraguas).
# Copiar a /etc/nginx/sites-available/chinos_cafe, habilitarlo y recargar nginx.
#   sudo cp deploy/nginx_chinos_cafe.conf /etc/nginx/sites-available/chinos_cafe
#   sudo ln -sf /etc/nginx/sites-available/chinos_cafe /etc/nginx/sites-enabled/chinos_cafe
#   sudo rm -f /etc/nginx/sites-enabled/default      # evitar el sitio por defecto
#   sudo nginx -t && sudo systemctl reload nginx
#
# server_name _  => no depende de la IP (la VM usa IP dinamica por DHCP).
#
# Defensas aplicadas:
#   - Redireccion de HTTP (80) a HTTPS (443) con 301, salvo el canal de replica.
#   - HTTP/2 + TLS. Cabeceras: HSTS, CSP estricta, Permissions-Policy,
#     X-Frame-Options DENY, X-Content-Type-Options, Referrer-Policy, COOP/CORP/COEP.
#   - server_tokens off + limit_req (rate-limiting).

limit_req_zone $binary_remote_addr zone=chinos_limite:10m rate=30r/s;

# --- HTTP (80): canal interno de replica + redireccion del resto a HTTPS -----
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # Canal interno de replicacion PC -> VM (red host-only aislada, protegido
    # por la clave compartida X-Replica-Token). Se sirve por HTTP para que el
    # POST no choque con la redireccion a HTTPS ni con el certificado autofirmado.
    location /api/replica {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Todo lo demas se fuerza a HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS (443): sitio real endurecido -------------------------------------
server {
    listen 443 ssl http2 default_server;
    server_name _;

    ssl_certificate     /etc/nginx/ssl/chinos.crt;
    ssl_certificate_key /etc/nginx/ssl/chinos.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    location / {
        limit_req zone=chinos_limite burst=60 nodelay;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
