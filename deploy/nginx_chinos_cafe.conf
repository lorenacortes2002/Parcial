# Sitio NGINX de CHINOS CAFÉ en la máquina virtual (sucursal Veraguas).
# Copiar a /etc/nginx/sites-available/chinos_cafe y recargar nginx.
server {
    listen 80;
    server_name 192.168.56.50;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
server {
    listen 443 ssl;
    server_name 192.168.56.50;
    ssl_certificate     /etc/nginx/ssl/chinos.crt;
    ssl_certificate_key /etc/nginx/ssl/chinos.key;
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
