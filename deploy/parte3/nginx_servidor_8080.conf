# Parte III — Servidor NGINX para el laboratorio de ataque/mitigación.
# IP fija 172.20.10.100, HTTP en 8080 y HTTPS en 8443. Incluye rate-limiting (mitigación).
# Copiar a /etc/nginx/sites-available/servidor_lab y recargar nginx.

# Mitigación: límite de peticiones por IP (10 req/s con ráfaga de 20) contra DoS/fuerza bruta HTTP.
limit_req_zone $binary_remote_addr zone=lab_limite:10m rate=10r/s;

server {
    listen 172.20.10.100:8080;
    server_name 172.20.10.100;
    # Redirigir a HTTPS (el sitio "acepta HTTPS")
    return 301 https://172.20.10.100:8443$request_uri;
}

server {
    listen 172.20.10.100:8443 ssl;
    server_name 172.20.10.100;

    ssl_certificate     /etc/nginx/ssl/lab.crt;
    ssl_certificate_key /etc/nginx/ssl/lab.key;

    # Mitigación: ocultar la versión de NGINX y cabeceras de seguridad.
    server_tokens off;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        limit_req zone=lab_limite burst=20 nodelay;   # frena ráfagas de peticiones
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
