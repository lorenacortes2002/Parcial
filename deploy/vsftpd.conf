# Servidor FTP (vsftpd) para la VM de CHINOS CAFÉ.
# Copiar a /etc/vsftpd.conf y reiniciar vsftpd. El login es con el usuario del sistema (angel).
listen=YES
listen_ipv6=NO
anonymous_enable=NO
local_enable=YES
write_enable=YES
local_umask=022
chroot_local_user=YES
allow_writeable_chroot=YES
pasv_enable=YES
pasv_min_port=40000
pasv_max_port=40100
# Mensaje de bienvenida
ftpd_banner=CHINOS CAFE FTP - acceso autorizado
