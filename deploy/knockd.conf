# Port Knocking (knockd) para la VM de CHINOS CAFÉ.
# Oculta SSH (22) y FTP (21): solo se abren tras la secuencia correcta de "toques".
# Copiar a /etc/knockd.conf.
[options]
    UseSyslog

[openSSH]
    sequence    = 7000,8000,9000
    seq_timeout = 5
    command     = /usr/sbin/iptables -I INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
    tcpflags    = syn

[closeSSH]
    sequence    = 9000,8000,7000
    seq_timeout = 5
    command     = /usr/sbin/iptables -D INPUT -s %IP% -p tcp --dport 22 -j ACCEPT
    tcpflags    = syn

[openFTP]
    sequence    = 1111,2222,3333
    seq_timeout = 5
    command     = /usr/sbin/iptables -I INPUT -s %IP% -p tcp --dport 21 -j ACCEPT
    tcpflags    = syn

[closeFTP]
    sequence    = 3333,2222,1111
    seq_timeout = 5
    command     = /usr/sbin/iptables -D INPUT -s %IP% -p tcp --dport 21 -j ACCEPT
    tcpflags    = syn
